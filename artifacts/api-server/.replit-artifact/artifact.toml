kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "uv run --frozen python -m cascadegraph_runtime"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen"]

[services.production.run]
args = ["uv", "run", "--frozen", "python", "-m", "cascadegraph_runtime"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
