[project]
name = "cascadegraph-runtime"
version = "0.1.0"
description = "Python runtime scaffold for CascadeGraph"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "itsdangerous>=2.2.0",
    "openai>=3.49.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruff>=0.17.4",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
