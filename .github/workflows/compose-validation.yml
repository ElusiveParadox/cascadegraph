name: Real Compose validation
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/cascadegraph-mvp"]
    paths:
      - "sample-app/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/compose-validation.yml"
permissions:
  contents: read
jobs:
  experiment:
    name: Measured three-service experiment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.13.4"
      - run: uv sync --frozen
      - run: docker compose -f sample-app/compose.yaml config --quiet
      - run: docker compose -f sample-app/compose.yaml up --build --wait --wait-timeout 180 -d
      - run: uv run --frozen python sample-app/experiment.py
        env:
          LLM_ENABLED: "false"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: measured-validation
          path: generated-artifacts/*validation.json
          retention-days: 14
          if-no-files-found: warn
      - run: docker compose -f sample-app/compose.yaml logs --tail 30
        if: failure()
      - run: docker compose -f sample-app/compose.yaml down --volumes --remove-orphans
        if: always()
